name: Mem release

# Push a version tag to publish an update: git tag v0.1.8 && git push --tags
# Installed copies of Mem check this repository's latest release.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: mem-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Build installer
        shell: bash
        run: |
          node scripts/build-desktop-artifact.ts \
            --platform win --target nsis --arch x64 \
            --build-version "${GITHUB_REF_NAME#v}" --verbose

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: desktop-windows
          path: release/*
          if-no-files-found: error
          retention-days: 1

  macos:
    name: Build macOS installer (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
    env:
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Ensure Rust target
        run: rustup target add "${{ matrix.rust_target }}"

      # Unsigned on purpose: no Apple Developer account, so no --signed flag and
      # no signing secrets. The built app disables its own updater.
      - name: Build installer
        run: |
          node scripts/build-desktop-artifact.ts \
            --platform mac --target dmg --arch "${{ matrix.arch }}" \
            --build-version "${GITHUB_REF_NAME#v}" --verbose

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: desktop-mac-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub release
    needs: [windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/scripts...

      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release

      # Windows keeps its existing asset names: installed copies update from
      # Mem-<version>-x64.exe and latest.yml.
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            release/*.exe release/*.blockmap release/latest.yml \
            release/*.dmg release/*.zip release/latest-mac.yml
